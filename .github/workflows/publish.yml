name: Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      - name: Build site
        run: hugo --minify
        working-directory: blog

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1

      - name: Sync to SeaweedFS S3
        run: |
          aws s3 sync blog/public/ s3://${NIX_CACHE_BUCKET}/ \
            --endpoint-url http://192.168.1.88:8333 \
            --delete
